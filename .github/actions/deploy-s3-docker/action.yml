name: 'Deploy to S3 bucket'
description: 'Deploy a static website to AWS S3 using Docker custom action'
inputs:
  bucket:
    description: 'Provide the name of the S3 bucket'
    required: true
  bucket-region:
    description: 'Provide the region for S3 bucket'
    required: false
    default: 'us-east-1'
  dist-folder:
    description: 'The folder containing the deployable files'
    required: true
outputs:
  website-url:
    description: 'The URL of the deployed website'
runs:
  using: 'docker'
  image: 'Dockerfile'